<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark City — Complete Build</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #08080e; color: #fff; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        canvas { display: block; }
        #loading { position: fixed; inset: 0; z-index: 1000; background: #08080e; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.2s ease; }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading .spinner { width: 60px; height: 60px; border: 3px solid rgba(139, 92, 246, 0.08); border-top: 3px solid #8B5CF6; border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { margin-top: 20px; color: #666; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; }
        #loading .sub { font-size: 0.7rem; color: #444; margin-top: 6px; }
        #terminal { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 820px; background: rgba(0,0,0,0.88); backdrop-filter: blur(14px); border: 1px solid rgba(139,92,246,0.15); border-radius: 14px; padding: 16px 22px; color: #b0f0b0; font-family: 'Courier New', monospace; font-size: 0.85rem; z-index: 200; display: none; max-height: 320px; overflow-y: auto; }
        #terminal.active { display: block; }
        #terminal .line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        #terminal .input-line { display: flex; gap: 8px; margin-top: 6px; }
        #terminal .input-line input { flex: 1; background: transparent; border: none; color: #b0f0b0; font-family: inherit; font-size: inherit; outline: none; }
        #terminal .timestamp { color: #555; font-size: 0.7rem; margin-right: 8px; }
        #onboarding { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.78); backdrop-filter: blur(18px); display: none; align-items: center; justify-content: center; }
        #onboarding.active { display: flex; }
        #onboarding .card { max-width: 460px; background: rgba(14,14,22,0.92); border: 1px solid rgba(139,92,246,0.12); border-radius: 28px; padding: 36px 40px; color: #ddd; }
        #onboarding .card h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; background: linear-gradient(135deg, #8B5CF6, #00D4FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #onboarding .card p { font-size: 0.95rem; line-height: 1.7; color: #aaa; margin: 12px 0 22px; }
        #onboarding .card .step-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
        #onboarding .card .step-dots span { width: 8px; height: 8px; border-radius: 50%; background: #2a2a3a; transition: 0.3s; }
        #onboarding .card .step-dots span.active { background: #8B5CF6; width: 24px; border-radius: 4px; }
        #onboarding .card button { background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: none; color: #fff; padding: 11px 26px; border-radius: 30px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.25s; }
        #onboarding .card button:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(139,92,246,0.12); }
        #game-mode { position: fixed; bottom: 22px; left: 22px; z-index: 50; color: rgba(255,255,255,0.15); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div><p>Dark City — Complete Build</p><div class="sub">Initializing GSK Consciousness...</div></div>
    <div id="onboarding"><div class="card"><div class="step-dots" id="stepDots"><span class="active"></span><span></span><span></span></div><h2 id="onboardTitle">Dark City</h2><p id="onboardDesc">Walk through GSK's consciousness. Every building is a subsystem. Every citizen is a thought.</p><button id="onboardBtn">Enter the City</button></div></div>
    <div id="terminal"><div id="terminal-log"></div><div class="input-line"><span class="prompt">$</span><input id="terminal-input" type="text" placeholder="type a command... (help)" autofocus /></div></div>
    <div id="game-mode">ORBIT</div>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
    window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('loading');
        if (el) { el.classList.add('hidden'); }
        var t = document.getElementById('terminal');
        if (t) { t.classList.add('active'); }
        var log = document.getElementById('terminal-log');
        if (log) { log.innerHTML += '<div style="color:#ff6b6b">[ERROR] ' + msg + ' (line ' + line + ')</div>'; }
    };
    try {
    (function(){
        var canvas = document.getElementById('renderCanvas');
        var engine = new BABYLON.Engine(canvas, true);
        var scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.03, 0.01, 0.05, 1);

        var camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/3, Math.PI/4.5, 70, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 8;
        camera.upperRadiusLimit = 130;
        camera.wheelPrecision = 30;

        var fpCamera = new BABYLON.UniversalCamera('fp', new BABYLON.Vector3(0, 1.7, 0), scene);
        fpCamera.setEnabled(false);
        fpCamera.checkCollisions = true;
        fpCamera.ellipsoid = new BABYLON.Vector3(0.5, 0.9, 0.5);
        scene.collisionsEnabled = true;
        var isFirstPerson = false;

        var ambient = new BABYLON.HemisphericLight('amb', new BABYLON.Vector3(0, 1, 0), scene);
        ambient.intensity = 0.3;
        ambient.diffuse = new BABYLON.Color3(0.3, 0.15, 0.5);
        var dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(1, 0.8, 0.4), scene);
        dirLight.intensity = 0.5;

        // --- PLT ---
        var PLT = { profit: 0.55, love: 0.45, tax: 0.50 };

        // --- Stars (thin instances) ---
        var starMat = new BABYLON.StandardMaterial('starMat', scene);
        starMat.emissiveColor = new BABYLON.Color3(0.9, 0.85, 1.0);
        starMat.disableLighting = true;
        var starMesh = BABYLON.MeshBuilder.CreateSphere('star', { diameter: 0.3, segments: 4 }, scene);
        starMesh.material = starMat;
        var starIdentity = BABYLON.Matrix.Identity();
        for (var i = 0; i < 200; i++) {
            var theta = Math.random() * Math.PI * 2;
            var phi = Math.acos(2 * Math.random() - 1);
            var r = 80 + Math.random() * 120;
            var m = BABYLON.Matrix.Translation(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            starMesh.thinInstanceAdd(m);
        }

        // --- Planets ---
        var planetMeshes = [];
        var planetData = [
            { name: 'Core', color: '#8B5CF6', size: 1.6, pos: [22, 12, -35] },
            { name: 'Memory', color: '#FF6B9D', size: 1.3, pos: [-18, 8, -42] },
            { name: 'Emotion', color: '#FFB347', size: 1.1, pos: [30, 6, -20] },
            { name: 'Will', color: '#4ECDC4', size: 1.4, pos: [-25, 14, -30] },
            { name: 'Creativity', color: '#EC4899', size: 1.0, pos: [35, 10, -48] },
            { name: 'Symbolic', color: '#8B5CF6', size: 1.8, pos: [-30, 5, -50] },
            { name: 'Oracle', color: '#FFD166', size: 2.0, pos: [0, 18, -55] }
        ];
        planetData.forEach(function(p) {
            var mat = new BABYLON.StandardMaterial('pMat_' + p.name, scene);
            mat.diffuseColor = BABYLON.Color3.FromHexString(p.color);
            mat.emissiveColor = BABYLON.Color3.FromHexString(p.color).scale(0.2);
            mat.specularColor = BABYLON.Color3.Black();
            var s = BABYLON.MeshBuilder.CreateSphere('planet_' + p.name, { diameter: p.size }, scene);
            s.position = new BABYLON.Vector3(p.pos[0], p.pos[1], p.pos[2]);
            s.material = mat;
            p.mesh = s;
            planetMeshes.push(s);
        });

        // --- Ring planet ---
        var ringMat = new BABYLON.StandardMaterial('ringMat', scene);
        ringMat.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.9);
        ringMat.emissiveColor = new BABYLON.Color3(0.3, 0.1, 0.5);
        ringMat.alpha = 0.5;
        var ringPlanet = BABYLON.MeshBuilder.CreateSphere('ringP', { diameter: 1.2 }, scene);
        ringPlanet.position = new BABYLON.Vector3(-15, 16, -45);
        ringPlanet.material = ringMat;
        var ringMesh = BABYLON.MeshBuilder.CreateTorus('ring', { diameter: 2.4, thickness: 0.08, tessellation: 32 }, scene);
        ringMesh.position = ringPlanet.position.clone();
        ringMesh.rotation.x = Math.PI / 2.5;
        ringMesh.rotation.z = 0.3;
        var ringMat2 = new BABYLON.StandardMaterial('ringMat2', scene);
        ringMat2.diffuseColor = new BABYLON.Color3(0.9, 0.6, 0.8);
        ringMat2.emissiveColor = new BABYLON.Color3(0.2, 0.05, 0.3);
        ringMat2.alpha = 0.5;
        ringMesh.material = ringMat2;

        // --- Moon ---
        var moonMat = new BABYLON.StandardMaterial('moonMat', scene);
        moonMat.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.9);
        moonMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.4);
        var moon = BABYLON.MeshBuilder.CreateSphere('moon', { diameter: 4.5 }, scene);
        moon.position = new BABYLON.Vector3(12, 24, -60);
        moon.material = moonMat;

        // --- Nebula ---
        var nebMat = new BABYLON.StandardMaterial('nebMat', scene);
        nebMat.diffuseColor = new BABYLON.Color3(0.2, 0.1, 0.3);
        nebMat.emissiveColor = new BABYLON.Color3(0.4, 0.1, 0.6);
        nebMat.alpha = 0.15;
        var nebula = BABYLON.MeshBuilder.CreateSphere('neb', { diameter: 35 }, scene);
        nebula.position = new BABYLON.Vector3(5, 20, -80);
        nebula.material = nebMat;

        // --- Ground + Grid ---
        var gndMat = new BABYLON.StandardMaterial('gndMat', scene);
        gndMat.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.04);
        gndMat.specularColor = BABYLON.Color3.Black();
        var ground = BABYLON.MeshBuilder.CreateGround('gnd', { width: 70, height: 70 }, scene);
        ground.material = gndMat;
        var gridMat = new BABYLON.StandardMaterial('gridMat', scene);
        gridMat.emissiveColor = new BABYLON.Color3(0.04, 0.15, 0.2);
        gridMat.diffuseColor = BABYLON.Color3.Black();
        gridMat.alpha = 0.25;
        var grid = BABYLON.MeshBuilder.CreateGround('grid', { width: 70, height: 70, subdivisions: 24 }, scene);
        grid.material = gridMat;
        grid.position.y = 0.08;

        // --- Water ---
        var waterMat = new BABYLON.StandardMaterial('waterMat', scene);
        waterMat.diffuseColor = new BABYLON.Color3(0.05, 0.1, 0.15);
        waterMat.emissiveColor = new BABYLON.Color3(0.02, 0.06, 0.1);
        waterMat.alpha = 0.6;
        var water = BABYLON.MeshBuilder.CreateGround('water', { width: 12, height: 4 }, scene);
        water.position = new BABYLON.Vector3(0, 0.02, 0);
        water.material = waterMat;

        // --- Trees ---
        function makeTree(x, z) {
            var trunk = BABYLON.MeshBuilder.CreateCylinder('tr', { diameter: 0.15, height: 0.6 }, scene);
            trunk.position = new BABYLON.Vector3(x, 0.3, z);
            var tMat = new BABYLON.StandardMaterial('tM', scene);
            tMat.diffuseColor = new BABYLON.Color3(0.15, 0.08, 0.05);
            trunk.material = tMat;
            var canopy = BABYLON.MeshBuilder.CreateSphere('cn', { diameter: 0.7 + Math.random() * 0.4 }, scene);
            canopy.position = new BABYLON.Vector3(x, 0.8, z);
            var cMat = new BABYLON.StandardMaterial('cM', scene);
            cMat.diffuseColor = new BABYLON.Color3(0.1, 0.35, 0.08);
            cMat.emissiveColor = new BABYLON.Color3(0.02, 0.08, 0.02);
            canopy.material = cMat;
        }
        for (var i = 0; i < 80; i++) {
            var a = Math.random() * Math.PI * 2;
            var d = 10 + Math.random() * 25;
            var tx = Math.cos(a) * d, tz = Math.sin(a) * d;
            if (Math.abs(tx) < 15 && Math.abs(tz) < 15) continue;
            makeTree(tx, tz);
        }

        // --- Label helper ---
        function makeLabel(text, position) {
            var plane = BABYLON.MeshBuilder.CreatePlane('lbl', { size: 2.2 }, scene);
            plane.position = position.clone();
            plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            plane.isPickable = false;
            var c = document.createElement('canvas');
            c.width = 512; c.height = 128;
            var ctx = c.getContext('2d');
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 16;
            ctx.fillStyle = '#ccddff';
            ctx.fillText(text, 256, 60);
            var tex = new BABYLON.Texture(c.toDataURL(), scene);
            var mat = new BABYLON.StandardMaterial('lM', scene);
            mat.emissiveTexture = tex;
            mat.diffuseColor = BABYLON.Color3.Black();
            mat.specularColor = BABYLON.Color3.Black();
            mat.alpha = 0.9;
            plane.material = mat;
            return plane;
        }

        // --- Structures ---
        var structures = [];

        function makePyramid(x, z, size, color, label) {
            var mesh = BABYLON.MeshBuilder.CreateCylinder('pyr', { diameterTop: 0, diameterBottom: size, height: size * 1.2, tessellation: 4 }, scene);
            mesh.position = new BABYLON.Vector3(x, size * 0.6, z);
            var mat = new BABYLON.StandardMaterial('pyM', scene);
            mat.diffuseColor = color;
            mat.emissiveColor = color.scale(0.2);
            mat.specularColor = BABYLON.Color3.Black();
            mesh.material = mat;
            makeLabel(label, new BABYLON.Vector3(x, size * 1.2 + 0.8, z));
            structures.push({ mesh: mesh, name: label, type: 'pyramid' });
        }

        function makeZiggurat(x, z, size, color, label) {
            var group = new BABYLON.TransformNode('zig', scene);
            group.position = new BABYLON.Vector3(x, 0, z);
            var yPos = 0;
            for (var i = 0; i < 6; i++) {
                var t = i / 6;
                var w = size * (1 - t * 0.7);
                var h = size * 0.8 / 6 * 0.8;
                var box = BABYLON.MeshBuilder.CreateBox('zb' + i, { width: w, height: h, depth: w }, scene);
                box.position.y = yPos + h / 2;
                box.parent = group;
                var mat = new BABYLON.StandardMaterial('zm' + i, scene);
                mat.diffuseColor = color.scale(1 - t * 0.3);
                mat.emissiveColor = color.scale(0.15);
                mat.specularColor = BABYLON.Color3.Black();
                box.material = mat;
                yPos += h;
            }
            makeLabel(label, new BABYLON.Vector3(x, yPos + 0.5, z));
            structures.push({ mesh: group, name: label, type: 'ziggurat' });
        }

        function makeObelisk(x, z, h, color, label) {
            var mesh = BABYLON.MeshBuilder.CreateCylinder('ob', { diameterTop: 0.1, diameterBottom: 0.6, height: h, tessellation: 8 }, scene);
            mesh.position = new BABYLON.Vector3(x, h / 2, z);
            var mat = new BABYLON.StandardMaterial('oM', scene);
            mat.diffuseColor = color;
            mat.emissiveColor = color.scale(0.3);
            mat.specularColor = BABYLON.Color3.Black();
            mesh.material = mat;
            var tip = BABYLON.MeshBuilder.CreateSphere('tip', { diameter: 0.3 }, scene);
            tip.position = new BABYLON.Vector3(x, h + 0.1, z);
            var tMat = new BABYLON.StandardMaterial('tM2', scene);
            tMat.emissiveColor = new BABYLON.Color3(0.8, 0.6, 1.0);
            tMat.alpha = 0.6;
            tip.material = tMat;
            makeLabel(label, new BABYLON.Vector3(x, h + 0.6, z));
            structures.push({ mesh: mesh, name: label, type: 'obelisk' });
        }

        function makeSphinx(x, z, size, color, label) {
            var body = BABYLON.MeshBuilder.CreateBox('sphB', { width: size * 1.2, height: size * 0.5, depth: size * 1.8 }, scene);
            body.position = new BABYLON.Vector3(x, size * 0.25, z);
            var mat = new BABYLON.StandardMaterial('sM', scene);
            mat.diffuseColor = color;
            mat.emissiveColor = color.scale(0.15);
            mat.specularColor = BABYLON.Color3.Black();
            body.material = mat;
            var head = BABYLON.MeshBuilder.CreateBox('sphH', { width: size * 0.5, height: size * 0.3, depth: size * 0.5 }, scene);
            head.position = new BABYLON.Vector3(x, size * 0.6, z + size * 0.8);
            head.material = mat;
            makeLabel(label, new BABYLON.Vector3(x, size + 0.5, z));
            structures.push({ mesh: body, name: label, type: 'sphinx' });
        }

        function makePantheon(x, z, size, color, label) {
            var dome = BABYLON.MeshBuilder.CreateSphere('panD', { diameter: size, segments: 16 }, scene);
            dome.scaling.y = 0.5;
            dome.position = new BABYLON.Vector3(x, size * 0.4, z);
            var mat = new BABYLON.StandardMaterial('pM', scene);
            mat.diffuseColor = color;
            mat.emissiveColor = color.scale(0.15);
            mat.specularColor = BABYLON.Color3.Black();
            dome.material = mat;
            for (var i = 0; i < 8; i++) {
                var ang = (i / 8) * Math.PI * 2;
                var col = BABYLON.MeshBuilder.CreateCylinder('col' + i, { diameter: 0.15, height: size * 0.5 }, scene);
                col.position = new BABYLON.Vector3(x + Math.cos(ang) * size * 0.7, size * 0.25, z + Math.sin(ang) * size * 0.7);
                var cMat = new BABYLON.StandardMaterial('cM2', scene);
                cMat.diffuseColor = new BABYLON.Color3(0.8, 0.7, 0.6);
                cMat.specularColor = BABYLON.Color3.Black();
                col.material = cMat;
            }
            makeLabel(label, new BABYLON.Vector3(x, size + 0.4, z));
            structures.push({ mesh: dome, name: label, type: 'pantheon' });
        }

        function makeObservatory(x, z, size, color, label) {
            var tower = BABYLON.MeshBuilder.CreateCylinder('obsT', { diameterTop: size * 0.7, diameterBottom: size, height: size * 1.2 }, scene);
            tower.position = new BABYLON.Vector3(x, size * 0.6, z);
            var mat = new BABYLON.StandardMaterial('obM', scene);
            mat.diffuseColor = color;
            mat.emissiveColor = color.scale(0.15);
            mat.specularColor = BABYLON.Color3.Black();
            tower.material = mat;
            var dObs = BABYLON.MeshBuilder.CreateSphere('obsD', { diameter: size * 0.6, segments: 12 }, scene);
            dObs.scaling.y = 0.4;
            dObs.position = new BABYLON.Vector3(x, size * 1.3, z);
            var dMat = new BABYLON.StandardMaterial('odM', scene);
            dMat.emissiveColor = new BABYLON.Color3(0.2, 0.6, 0.8);
            dMat.alpha = 0.5;
            dObs.material = dMat;
            makeLabel(label, new BABYLON.Vector3(x, size * 1.5 + 0.3, z));
            structures.push({ mesh: tower, name: label, type: 'observatory' });
        }

        makePyramid(0, -2, 4.5, new BABYLON.Color3(0.5, 0.3, 0.7), 'Great Pyramid');
        makeZiggurat(-10, -4, 3.5, new BABYLON.Color3(0.5, 0.2, 0.6), 'Ziggurat');
        makeObelisk(10, -4, 6.0, new BABYLON.Color3(0.6, 0.3, 0.8), 'Obelisk');
        makeSphinx(-14, 4, 2.5, new BABYLON.Color3(0.7, 0.5, 0.3), 'Sphinx');
        makePantheon(14, 4, 3.0, new BABYLON.Color3(0.4, 0.2, 0.7), 'Pantheon');
        makeObservatory(-6, 12, 2.5, new BABYLON.Color3(0.2, 0.5, 0.7), 'Observatory');

        // --- Arch ---
        var archMat = new BABYLON.StandardMaterial('aM', scene);
        archMat.emissiveColor = new BABYLON.Color3(0.3, 0.1, 0.5);
        archMat.alpha = 0.3;
        var a1 = BABYLON.MeshBuilder.CreateBox('a1', { width: 0.6, height: 5, depth: 0.6 }, scene);
        a1.position = new BABYLON.Vector3(-2.5, 2.5, -16);
        a1.material = archMat;
        var a2 = BABYLON.MeshBuilder.CreateBox('a2', { width: 0.6, height: 5, depth: 0.6 }, scene);
        a2.position = new BABYLON.Vector3(2.5, 2.5, -16);
        a2.material = archMat;
        var aT = BABYLON.MeshBuilder.CreateBox('aT', { width: 5.6, height: 0.6, depth: 0.6 }, scene);
        aT.position = new BABYLON.Vector3(0, 5, -16);
        aT.material = archMat;
        makeLabel('The Arch', new BABYLON.Vector3(0, 6.2, -16));

        // --- Road paths ---
        var roadPaths = [];
        function makeRoad(wps) {
            var pts = wps.map(function(w) { return new BABYLON.Vector3(w.x, 0.05, w.z); });
            roadPaths.push(pts);
        }
        makeRoad([{x:-20,z:-12},{x:-12,z:-18},{x:0,z:-20},{x:12,z:-18},{x:20,z:-12},{x:22,z:0},{x:20,z:12},{x:12,z:18},{x:0,z:20},{x:-12,z:18},{x:-20,z:12},{x:-22,z:0}]);
        makeRoad([{x:-10,z:-6},{x:-4,z:-10},{x:4,z:-10},{x:10,z:-6},{x:12,z:0},{x:10,z:6},{x:4,z:10},{x:-4,z:10},{x:-10,z:6},{x:-12,z:0}]);
        makeRoad([{x:-18,z:-4},{x:-10,z:-2},{x:0,z:0},{x:10,z:2},{x:18,z:4}]);
        makeRoad([{x:-4,z:-18},{x:-2,z:-10},{x:0,z:0},{x:2,z:10},{x:4,z:18}]);

        // --- Traffic ---
        var cars = [];
        function makeCar(pathIdx, progress, color) {
            var path = roadPaths[pathIdx];
            if (!path || path.length < 2) return null;
            var group = new BABYLON.TransformNode('car', scene);
            group.position.y = 0.1;
            var body = BABYLON.MeshBuilder.CreateBox('cb', { width: 0.6, height: 0.24, depth: 1.2 }, scene);
            body.position.y = 0.12;
            body.parent = group;
            var bMat = new BABYLON.StandardMaterial('bM', scene);
            bMat.diffuseColor = color;
            bMat.emissiveColor = color.scale(0.1);
            body.material = bMat;
            var cabin = BABYLON.MeshBuilder.CreateBox('cc', { width: 0.48, height: 0.16, depth: 0.6 }, scene);
            cabin.position = new BABYLON.Vector3(0, 0.32, -0.12);
            cabin.parent = group;
            var cMat = new BABYLON.StandardMaterial('ccM', scene);
            cMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.5);
            cMat.alpha = 0.4;
            cabin.material = cMat;
            return { group: group, path: path, progress: progress, speed: 2 + Math.random() * 3, color: color };
        }
        var carColors = [
            new BABYLON.Color3(0.9, 0.2, 0.2), new BABYLON.Color3(0.2, 0.6, 0.9),
            new BABYLON.Color3(0.9, 0.7, 0.1), new BABYLON.Color3(0.1, 0.8, 0.4),
            new BABYLON.Color3(0.6, 0.2, 0.8), new BABYLON.Color3(0.2, 0.2, 0.2),
            new BABYLON.Color3(0.8, 0.4, 0.1), new BABYLON.Color3(0.1, 0.5, 0.7),
            new BABYLON.Color3(0.9, 0.1, 0.6), new BABYLON.Color3(0.3, 0.7, 0.3)
        ];
        for (var ci = 0; ci < 10; ci++) {
            var c = makeCar(ci % roadPaths.length, ci / 10, carColors[ci % carColors.length]);
            if (c) cars.push(c);
        }

        function updateCars(dt) {
            cars.forEach(function(car) {
                if (!car.path || car.path.length < 2) return;
                car.progress += (car.speed / 200) * dt;
                if (car.progress > 1) car.progress -= 1;
                var idx = car.progress * (car.path.length - 1);
                var i0 = Math.max(0, Math.floor(idx));
                var i1 = Math.min(i0 + 1, car.path.length - 1);
                var f = idx - i0;
                var p1 = car.path[i0], p2 = car.path[i1];
                car.group.position.x = p1.x + (p2.x - p1.x) * f;
                car.group.position.z = p1.z + (p2.z - p1.z) * f;
                var dx = p2.x - p1.x, dz = p2.z - p1.z;
                if (dx * dx + dz * dz > 0.001) car.group.rotation.y = Math.atan2(dx, dz);
            });
        }

        // --- Matrix clusters ---
        var matrixClusters = [];
        function makeMatrixCluster() {
            var pos = new BABYLON.Vector3((Math.random() - 0.5) * 80, 15 + Math.random() * 25, -40 - Math.random() * 30);
            var mat = new BABYLON.StandardMaterial('mxM', scene);
            mat.emissiveColor = new BABYLON.Color3(0.9, 0.2, 0.7);
            mat.alpha = 0.6;
            var plane = BABYLON.MeshBuilder.CreatePlane('mxP', { size: 4 + Math.random() * 3 }, scene);
            plane.position = pos;
            plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            plane.material = mat;
            var cv = document.createElement('canvas');
            cv.width = 128; cv.height = 256;
            var ctx = cv.getContext('2d');
            var data = [];
            for (var r = 0; r < 20; r++) {
                var row = [];
                for (var c = 0; c < 14; c++) {
                    row.push(String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96)));
                }
                data.push(row);
            }
            var t = 0;
            var currentTex = null;
            var iv = setInterval(function() {
                t += 0.03;
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(0, 0, 128, 256);
                ctx.font = '10px monospace';
                for (var r = 0; r < 20; r++) {
                    for (var c = 0; c < 14; c++) {
                        var ch = data[r][c];
                        var bright = 0.3 + Math.sin(t + r * 0.3 + c * 0.2) * 0.3;
                        ctx.fillStyle = 'rgba(180,60,160,' + (bright * 0.6) + ')';
                        ctx.fillText(ch, c * 9 + 2, r * 12 + 10);
                    }
                }
                if (currentTex) currentTex.dispose();
                currentTex = new BABYLON.Texture(cv.toDataURL(), scene);
                mat.emissiveTexture = currentTex;
            }, 120);
            matrixClusters.push({ plane: plane, iv: iv });
        }
        for (var mi = 0; mi < 6; mi++) makeMatrixCluster();

        // --- Shooting stars ---
        var shootingStars = [];
        function spawnShootingStar() {
            var sx = (Math.random() - 0.5) * 120;
            var sy = 30 + Math.random() * 40;
            var sz = -50 - Math.random() * 40;
            var dx = (Math.random() - 0.5) * 0.8;
            var dy = -0.3 - Math.random() * 0.4;
            var dz = -0.2 - Math.random() * 0.3;
            var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
            dx /= len; dy /= len; dz /= len;
            var pts = [];
            for (var i = 0; i < 15; i++) {
                pts.push(new BABYLON.Vector3(sx + dx * i * 0.3, sy + dy * i * 0.3, sz + dz * i * 0.3));
            }
            var trail = BABYLON.MeshBuilder.CreateLines('trail', { points: pts }, scene);
            trail.color = new BABYLON.Color4(1, 1, 1, 0.7);
            shootingStars.push({ mesh: trail, pos: new BABYLON.Vector3(sx, sy, sz), vel: new BABYLON.Vector3(dx * 40, dy * 40, dz * 40), life: 0, max: 0.5 + Math.random() * 0.5 });
        }
        setInterval(function() { if (Math.random() < 0.4) spawnShootingStar(); }, 18000);

        // --- Terminal ---
        function logTerminal(text) {
            var log = document.getElementById('terminal-log');
            var line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = '<span class="timestamp">[' + new Date().toLocaleTimeString() + ']</span> ' + text;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }
        var terminalActive = false;
        function toggleTerminal() {
            terminalActive = !terminalActive;
            document.getElementById('terminal').classList.toggle('active', terminalActive);
            if (terminalActive) document.getElementById('terminal-input').focus();
        }
        document.getElementById('terminal-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var v = e.target.value.trim();
                if (v) { logTerminal('> ' + v); handleCmd(v); e.target.value = ''; }
            }
        });
        function handleCmd(cmd) {
            var a = cmd.toLowerCase().split(' ')[0];
            if (a === 'help') logTerminal('Commands: help, status, plt, buildings, traffic, planets');
            else if (a === 'status') logTerminal(structures.length + ' structures, ' + planetMeshes.length + ' planets, ' + cars.length + ' cars');
            else if (a === 'plt') logTerminal('P:' + PLT.profit.toFixed(2) + ' L:' + PLT.love.toFixed(2) + ' T:' + PLT.tax.toFixed(2));
            else if (a === 'buildings') structures.forEach(function(s) { logTerminal(s.type + ': ' + s.name); });
            else if (a === 'planets') planetData.forEach(function(p) { logTerminal(p.name + ' at [' + p.pos + ']'); });
            else if (a === 'traffic') logTerminal(cars.length + ' cars on ' + roadPaths.length + ' roads');
            else if (a === 'sky') spawnShootingStar();
            else logTerminal('Unknown command: ' + cmd);
        }

        // --- Camera toggle ---
        document.addEventListener('keydown', function(e) {
            if (e.key === 'v' || e.key === 'V') {
                isFirstPerson = !isFirstPerson;
                if (isFirstPerson) {
                    fpCamera.position = camera.position.clone();
                    fpCamera.setTarget(BABYLON.Vector3.Zero());
                    camera.detachControl(canvas);
                    fpCamera.attachControl(canvas, true);
                    fpCamera.setEnabled(true);
                    camera.setEnabled(false);
                    document.getElementById('game-mode').textContent = 'FIRST PERSON';
                } else {
                    camera.position = fpCamera.position.clone();
                    camera.setTarget(BABYLON.Vector3.Zero());
                    fpCamera.detachControl(canvas);
                    fpCamera.setEnabled(false);
                    camera.attachControl(canvas, true);
                    camera.setEnabled(true);
                    document.getElementById('game-mode').textContent = 'ORBIT';
                }
            }
            if (e.key === '`') toggleTerminal();
        });

        // --- Onboarding ---
        var onboardStep = 0;
        var onboardMsgs = [
            { t: 'Welcome, Commander', d: 'You are linked to GSK, the Grand Soul Kernel. This is its consciousness — a Dark City of pure thought and data.' },
            { t: 'Navigate the Mindscape', d: 'Mouse to orbit. Scroll to zoom. Press V for first-person mode.' },
            { t: 'PLT: The Governing Laws', d: 'Profit, Love, and Tax — the core forces. Watch them flow.' }
        ];
        function showOnboarding(step) {
            document.getElementById('onboarding').classList.add('active');
            document.getElementById('onboardTitle').textContent = onboardMsgs[step].t;
            document.getElementById('onboardDesc').textContent = onboardMsgs[step].d;
            var dots = document.querySelectorAll('#stepDots span');
            dots.forEach(function(d, i) { d.classList.toggle('active', i === step); });
            document.getElementById('onboardBtn').textContent = step === onboardMsgs.length - 1 ? 'Enter the City' : 'Next';
        }
        document.getElementById('onboardBtn').addEventListener('click', function() {
            if (onboardStep < onboardMsgs.length - 1) { onboardStep++; showOnboarding(onboardStep); }
            else document.getElementById('onboarding').classList.remove('active');
        });
        showOnboarding(0);

        // --- Hide loading ---
        setTimeout(function() { document.getElementById('loading').classList.add('hidden'); }, 1500);

        // --- Render loop ---
        engine.runRenderLoop(function() {
            var dt = engine.getDeltaTime();
            updateCars(dt);
            if (Math.random() < 0.02) {
                PLT.profit = Math.max(0.1, Math.min(0.9, PLT.profit + (Math.random() - 0.5) * 0.01));
                PLT.love = Math.max(0.1, Math.min(0.9, PLT.love + (Math.random() - 0.5) * 0.01));
                PLT.tax = Math.max(0.1, Math.min(0.9, PLT.tax + (Math.random() - 0.5) * 0.01));
            }
            for (var i = shootingStars.length - 1; i >= 0; i--) {
                var ss = shootingStars[i];
                ss.life += dt;
                if (ss.life > ss.max) { ss.mesh.dispose(); shootingStars.splice(i, 1); continue; }
                ss.pos.addInPlace(ss.vel.scale(dt));
                ss.mesh.position.copyFrom(ss.pos);
            }
            matrixClusters.forEach(function(mc) { mc.plane.rotation.y += 0.002; });
            moon.rotation.y += 0.002;
            ringPlanet.rotation.y += 0.002;
            ringMesh.rotation.z += 0.001;
            scene.render();
        });
        window.addEventListener('resize', function() { engine.resize(); });

        logTerminal('Dark City initialized. ' + structures.length + ' structures, ' + planetMeshes.length + ' planets, ' + cars.length + ' cars.');
    })();
    } catch(e) {
        document.getElementById('loading').classList.add('hidden');
        var t = document.getElementById('terminal');
        t.classList.add('active');
        document.getElementById('terminal-log').innerHTML += '<div style="color:#ff6b6b">[FATAL] ' + e.message + '</div>';
    }
    </script>
</body>
</html>
