        const cars = []; function spawnCars() { cars.forEach(c => c.dispose()); cars.length = 0; const carColors = [ new BABYLON.Color3(0.9, 0.2, 0.2), new BABYLON.Color3(0.2, 0.6, 0.9), new BABYLON.Color3(0.9, 0.7, 0.1), new BABYLON.Color3(0.1, 0.8, 0.4), new BABYLON.Color3(0.6, 0.2, 0.8), new BABYLON.Color3(0.2, 0.2, 0.2), new BABYLON.Color3(0.8, 0.4, 0.1), new BABYLON.Color3(0.1, 0.5, 0.7), new BABYLON.Color3(0.9, 0.1, 0.6), new BABYLON.Color3(0.3, 0.7, 0.3) ]; for (let i = 0; i < 10; i++) { const pathIdx = i % roadPaths.length; const startProgress = (i / 10) + Math.random() * 0.1; const color = carColors[i % carColors.length]; const car = new TrafficCar(pathIdx, startProgress % 1, color); car.maxSpeed = 2 + Math.random() * 4; car.minSpeed = 0.3 + Math.random() * 0.5; car.speed = car.maxSpeed * (0.7 + Math.random() * 0.3); cars.push(car); } logTerminal(` ${cars.length} cars spawned on ${roadPaths.length} roads`); }
        spawnCars();
        document.addEventListener('keydown', (e) => { if (e.key === 'v' || e.key === 'V') toggleCamera(); if (e.key === '`') toggleTerminal(); });
        function toggleCamera() { isFirstPerson = !isFirstPerson; if (isFirstPerson) { const pos = camera.position.clone(); fpCamera.position.copyFrom(pos); fpCamera.setTarget(new BABYLON.Vector3(0, 0, 0)); camera.detachControl(canvas); fpCamera.attachControl(canvas, true); fpCamera.setEnabled(true); camera.setEnabled(false); document.getElementById('game-mode').textContent = ' FIRST PERSON'; canvas.requestPointerLock(); } else { const pos = fpCamera.position.clone(); camera.position.copyFrom(pos); camera.setTarget(new BABYLON.Vector3(0, 0, 0)); fpCamera.detachControl(canvas); fpCamera.setEnabled(false); camera.attachControl(canvas, true); camera.setEnabled(true); document.getElementById('game-mode').textContent = '⚡ ORBIT'; document.exitPointerLock(); } }
        let terminalActive = false; function toggleTerminal() { const term = document.getElementById('terminal'); terminalActive = !terminalActive; term.classList.toggle('active', terminalActive); if (terminalActive) document.getElementById('terminal-input').focus(); }
        document.getElementById('terminal-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const input = e.target.value; if (input.trim()) { logTerminal(`> ${input}`); handleCommand(input); e.target.value = ''; } } });
        function logTerminal(text) { const log = document.getElementById('terminal-log'); const line = document.createElement('div'); line.className = 'line'; line.innerHTML = `<span class="timestamp">[${new Date().toLocaleTimeString()}]</span> ${text}`; log.appendChild(line); log.scrollTop = log.scrollHeight; }
        function handleCommand(cmd) { const parts = cmd.split(' '); const action = parts[0].toLowerCase(); switch (action) { case 'help': logTerminal('Commands: help, status, plt, buildings, traffic, spawncar, sky, stats, clear, planets'); break; case 'status': logTerminal(`PLT: P=${PLT.profit.toFixed(2)} L=${PLT.love.toFixed(2)} T=${PLT.tax.toFixed(2)} | ${structures.length} structures, ${planetMeshes.length} planets, ${cars.length} cars, ${shootingStars.length} shooting stars`); break; case 'plt': logTerminal(`P: ${PLT.profit.toFixed(2)}  L: ${PLT.love.toFixed(2)}  T: ${PLT.tax.toFixed(2)}  → ${PLT.dominant}`); break; case 'buildings': structures.forEach(s => logTerminal(`${s.type}: ${s.name || 'unnamed'}`)); break; case 'traffic': const status = { totalCars: cars.length, roads: roadPaths.length, moving: cars.filter(c => c.speed > 0.5).length, stopped: cars.filter(c => c.speed < 0.5 && !c.isStopped).length, braking: cars.filter(c => c.brakeLightsOn).length }; logTerminal(` Traffic Status: Total Cars: ${status.totalCars}, Moving: ${status.moving}, Stopped: ${status.stopped}, Braking: ${status.braking}`); break; case 'spawncar': const colors = [ new BABYLON.Color3(0.9, 0.2, 0.2), new BABYLON.Color3(0.2, 0.6, 0.9), new BABYLON.Color3(0.9, 0.7, 0.1), new BABYLON.Color3(0.1, 0.8, 0.4), new BABYLON.Color3(0.6, 0.2, 0.8) ]; const pathIdx = Math.floor(Math.random() * roadPaths.length); const car = new TrafficCar(pathIdx, Math.random(), colors[Math.floor(Math.random() * colors.length)]); car.maxSpeed = 2 + Math.random() * 4; car.minSpeed = 0.3 + Math.random() * 0.5; car.speed = car.maxSpeed * (0.7 + Math.random() * 0.3); cars.push(car); logTerminal(` New car spawned. Total: ${cars.length}`); break; case 'sky': if (parts[1] === 'starfall') { spawnShootingStar(); logTerminal(' Shooting star spawned!'); } else logTerminal('Sky: stars, planets, moon, nebula, ringed planet'); break; case 'planets': planetMeshes.forEach(p => { const d = p.userData.planetData; logTerminal(`${d.name} at (${p.position.x.toFixed(1)}, ${p.position.y.toFixed(1)}, ${p.position.z.toFixed(1)})`); }); break; case 'stats': logTerminal(`Stars: ${starCount} | Planets: ${planetMeshes.length} | Structures: ${structures.length} | Cars: ${cars.length} | Matrix Clusters: ${matrixClusters.length}`); break; case 'clear': document.getElementById('terminal-log').innerHTML = ''; break; default: logTerminal(`Unknown command: ${cmd}`); } }
        let time = 0,
            pltTimer = 0;

        let onboardStep = 0;
        const onboardMessages = [
            { title: '✦ Welcome, Commander', desc: 'You are now linked to GSK, the Grand Soul Kernel. This is its consciousness, a Dark City of pure thought and data.' },
            { title: '✦ Navigate the Mindscape', desc: 'Use your mouse to orbit the core. Scroll to zoom. Press V to toggle First-Person mode and explore the streets.' },
            { title: '✦ PLT: The Governing Laws', desc: 'Profit, Love, and Tax. These are the core forces. Observe their flow. Understand their balance.' }
        ];

        document.getElementById('onboardBtn').addEventListener('click', () => {
            if (onboardStep < onboardMessages.length - 1) {
                onboardStep++;
                showOnboarding(onboardStep);
            } else {
                document.getElementById('onboarding').classList.remove('active');
            }
        });

        function showOnboarding(step) {
            const overlay = document.getElementById('onboarding');
            overlay.classList.add('active');
            document.getElementById('onboardTitle').textContent = onboardMessages[step].title;
            document.getElementById('onboardDesc').textContent = onboardMessages[step].desc;
            const dots = document.querySelectorAll('#stepDots span');
            dots.forEach((dot, i) => { dot.classList.toggle('active', i === step); });
            document.getElementById('onboardBtn').textContent = step === onboardMessages.length - 1 ? 'Enter the City' : 'Next';
        }

        // Initially show the first onboarding step
        showOnboarding(0);

        setTimeout(() => { document.getElementById('loading').classList.add('hidden'); }, 1800);
        engine.runRenderLoop(() => {
            const delta = engine.getDeltaTime();
            cars.forEach(car => car.update(delta, cars));
            if ((Math.random() < 0.02)) { PLT.profit = Math.max(0.1, Math.min(0.9, PLT.profit + (Math.random() - 0.5) * 0.01)); PLT.love = Math.max(0.1, Math.min(0.9, PLT.love + (Math.random() - 0.5) * 0.01)); PLT.tax = Math.max(0.1, Math.min(0.9, PLT.tax + (Math.random() - 0.5) * 0.01)); const moonColor = PLT.getMoonColor(); moonMat.emissiveColor = moonColor.scale(0.4); moonMat.diffuseColor = moonColor; document.getElementById('moon-plt-display').textContent = `${PLT.profit.toFixed(2)}/${PLT.love.toFixed(2)}/${PLT.tax.toFixed(2)}`; }
            for (let i = shootingStars.length - 1; i >= 0; i--) { const ss = shootingStars[i]; ss.life += delta; const progress = ss.life / ss.maxLife; if (progress > 1) { ss.mesh.dispose(); shootingStars.splice(i, 1); continue; } ss.position.addInPlace(ss.velocity.clone().scale(delta)); ss.mesh.position.copyFrom(ss.position); ss.mesh.material.alpha = 1 - progress; }
            matrixClusters.forEach(mc => { mc.plane.rotation.y += mc.rotSpeed; mc.plane.rotation.x += mc.rotSpeed * 0.2; });
            moon.rotation.y += delta * 0.02; moon.rotation.x += delta * 0.005; ringPlanet.rotation.y += delta * 0.015; ringMesh.rotation.z += delta * 0.008;
            planetMeshes.forEach((p, idx) => { const data = p.userData.planetData; if (data && data.label) data.label.position.copyFrom(p.position.clone().add(new BABYLON.Vector3(0, data.size + 0.6, 0))); });
            scene.render();
        });
        window.addEventListener('resize', () => { engine.resize(); });
    </script>
