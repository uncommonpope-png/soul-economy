<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark City — Complete Build (GSK Consciousness)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #08080e; color: #fff; font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading { position: fixed; inset: 0; z-index: 1000; background: #08080e; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.2s ease; }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading .spinner { width: 60px; height: 60px; border: 3px solid rgba(139, 92, 246, 0.08); border-top: 3px solid #8B5CF6; border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { margin-top: 20px; color: #666; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; }
        #loading .sub { font-size: 0.7rem; color: #444; margin-top: 6px; }
        #terminal { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 820px; background: rgba(0,0,0,0.88); backdrop-filter: blur(14px); border: 1px solid rgba(139,92,246,0.15); border-radius: 14px; padding: 16px 22px; color: #b0f0b0; font-family: 'Courier New', monospace; font-size: 0.85rem; z-index: 200; display: none; max-height: 320px; overflow-y: auto; box-shadow: 0 0 80px rgba(0,0,0,0.7); }
        #terminal.active { display: block; }
        #terminal .line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        #terminal .input-line { display: flex; gap: 8px; margin-top: 6px; }
        #terminal .input-line input { flex: 1; background: transparent; border: none; color: #b0f0b0; font-family: inherit; font-size: inherit; outline: none; }
        #terminal .timestamp { color: #555; font-size: 0.7rem; margin-right: 8px; }
        #onboarding { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.78); backdrop-filter: blur(18px); display: none; align-items: center; justify-content: center; }
        #onboarding.active { display: flex; }
        #onboarding .card { max-width: 460px; background: rgba(14,14,22,0.92); border: 1px solid rgba(139,92,246,0.12); border-radius: 28px; padding: 36px 40px; color: #ddd; box-shadow: 0 0 80px rgba(139,92,246,0.04); }
        #onboarding .card h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; background: linear-gradient(135deg, #8B5CF6, #00D4FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #onboarding .card p { font-size: 0.95rem; line-height: 1.7; color: #aaa; margin: 12px 0 22px; }
        #onboarding .card .step-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
        #onboarding .card .step-dots span { width: 8px; height: 8px; border-radius: 50%; background: #2a2a3a; transition: 0.3s; }
        #onboarding .card .step-dots span.active { background: #8B5CF6; width: 24px; border-radius: 4px; }
        #onboarding .card button { background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: none; color: #fff; padding: 11px 26px; border-radius: 30px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.25s; }
        #onboarding .card button:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(139,92,246,0.12); }
        #game-mode { position: fixed; bottom: 22px; left: 22px; z-index: 50; color: rgba(255,255,255,0.15); font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; text-shadow: 0 0 12px rgba(0,0,0,0.7); }
        #moon-tooltip { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.04); color: #aaa; font-size: 0.8rem; z-index: 40; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
        #moon-tooltip.visible { opacity: 1; }
        #building-info { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 300px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(139,92,246,0.2); padding: 15px; color: #eee; font-family: 'Inter', sans-serif; font-size: 0.9rem; z-index: 300; display: none; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
        #building-info.active { display: block; }
        #building-info h3 { margin-top: 0; color: #8B5CF6; font-size: 1.1rem; }
        #building-info p { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div><p>Dark City — Complete Build</p><div class="sub">Initializing GSK Consciousness...</div></div>
    <div id="onboarding"><div class="card"><div class="step-dots" id="stepDots"><span class="active"></span><span></span><span></span></div><h2 id="onboardTitle">✦ Dark City</h2><p id="onboardDesc">Walk through GSK's consciousness. Every building is a subsystem. Every citizen is a thought.</p><button id="onboardBtn">Enter the City</button></div></div>
    <div id="terminal"><div id="terminal-log"></div><div class="input-line"><span class="prompt">$</span><input id="terminal-input" type="text" placeholder="type a command... (help)" autofocus /></div></div>
    <div id="game-mode">⚡ ORBIT</div>
    <div id="moon-tooltip"> Moon — PLT: <span id="moon-plt-display">0.0/0.0/0.0</span></div>
    <div id="building-info"><h3 id="building-info-title"></h3><p>Type: <span id="building-info-type"></span></p><p>Activity: <span id="building-info-activity"></span></p><p>Health: <span id="building-info-health"></span></p><p>PLT Influence: <span id="building-info-plt"></span></p></div>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script>
    window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('loading');
        if (el) { el.classList.add('hidden'); }
        var t = document.getElementById('terminal');
        if (t) { t.classList.add('active'); }
        var log = document.getElementById('terminal-log');
        if (log) { log.innerHTML += '<div style="color:#ff6b6b">[ERROR] ' + msg + ' (line ' + line + ')</div>'; }
    };
    try {
        (function() {
            var canvas = document.getElementById('renderCanvas');
            var engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            var scene = new BABYLON.Scene(engine);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.0035;
            scene.fogColor = new BABYLON.Color3(0.04, 0.015, 0.07);
            scene.collisionsEnabled = true;

            // --- Input Handler ---
            var Input = {
                keys: {},
                mouse: { x: 0, y: 0, buttons: {} },
                init: function() {
                    window.addEventListener('keydown', function(e) { Input.keys[e.key] = true; });
                    window.addEventListener('keyup', function(e) { Input.keys[e.key] = false; });
                    canvas.addEventListener('mousemove', function(e) { Input.mouse.x = e.clientX; Input.mouse.y = e.clientY; });
                    canvas.addEventListener('mousedown', function(e) { Input.mouse.buttons[e.button] = true; });
                    canvas.addEventListener('mouseup', function(e) { Input.mouse.buttons[e.button] = false; });
                },
                isKeyDown: function(key) { return Input.keys[key] === true; },
                isMouseDown: function(button) { return Input.mouse.buttons[button] === true; }
            };
            Input.init();

            // --- PLT System ---
            var PLT = {
                profit: 0.55, love: 0.45, tax: 0.50,
                colors: { profit: '#FFB347', love: '#FF6B9D', tax: '#4ECDC4' },
                get score() { return this.profit + this.love - this.tax; },
                get dominant() {
                    var p = this.profit, l = this.love, t = this.tax;
                    if (p > l && p > t) return 'profit';
                    if (l > p && l > t) return 'love';
                    if (t > p && t > l) return 'tax';
                    return 'balanced';
                },
                getMoonColor: function() {
                    var p = this.profit, l = this.love, t = this.tax;
                    var avg = (p + l + t) / 3;
                    if (avg < 0.25) return new BABYLON.Color3(0.3, 0.3, 0.35);
                    if (p > 0.7 && p > l && p > t) return new BABYLON.Color3(1.0, 0.7, 0.28);
                    if (l > 0.7 && l > p && l > t) return new BABYLON.Color3(1.0, 0.42, 0.62);
                    if (t > 0.7 && t > p && t > l) return new BABYLON.Color3(0.31, 0.80, 0.77);
                    return new BABYLON.Color3(0.85, 0.85, 0.95);
                }
            };

            // --- Entity System ---
            function Entity() {
                this.mesh = null;
                this.update = function(dt) {};
                this.dispose = function() {
                    if (this.mesh) this.mesh.dispose();
                };
            }
            var entities = [];

            // --- Cameras ---
            var camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 3, Math.PI / 4.5, 70, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 8;
            camera.upperRadiusLimit = 130;
            camera.wheelPrecision = 30;

            var fpCamera = new BABYLON.UniversalCamera('fpCamera', new BABYLON.Vector3(0, 1.7, 0), scene);
            fpCamera.setEnabled(false);
            fpCamera.checkCollisions = true;
            fpCamera.ellipsoid = new BABYLON.Vector3(0.5, 0.9, 0.5);
            var isFirstPerson = false;

            // --- Lights ---
            var ambient = new BABYLON.HemisphericLight('ambient', new BABYLON.Vector3(0, 1, 0), scene);
            ambient.intensity = 0.22;
            ambient.diffuse = new BABYLON.Color3(0.25, 0.12, 0.45);
            var dirLight = new BABYLON.DirectionalLight('dirLight', new BABYLON.Vector3(1, 0.8, 0.4), scene);
            dirLight.intensity = 0.5;
            dirLight.position = new BABYLON.Vector3(20, 30, 10);
            var shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            // --- Post-Processing ---
            var pipeline = new BABYLON.DefaultRenderingPipeline("defaultPipeline", true, scene, [camera, fpCamera]);
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.8;
            pipeline.bloomWeight = 0.8;
            pipeline.bloomKernel = 64;
            pipeline.bloomScale = 0.5;
            pipeline.fxaaEnabled = true; // Anti-aliasing
            pipeline.sharpenEnabled = true;
            pipeline.sharpen.edgeAmount = 0.2;
            pipeline.sharpen.colorAmount = 1.0;
            pipeline.grainEnabled = true;
            pipeline.grain.intensity = 5;
            pipeline.grain.animated = true;
            pipeline.chromaticAberrationEnabled = true;
            pipeline.chromaticAberration.aberrationAmount = 2.0;
            pipeline.chromaticAberration.radialIntensity = 0.5;


            // --- Stars (Thin Instances) ---
            var starCount = 200;
            var starBaseMat = new BABYLON.StandardMaterial('starMat', scene);
            starBaseMat.emissiveColor = new BABYLON.Color3(0.9, 0.85, 1.0);
            starBaseMat.disableLighting = true;
            var starMesh = BABYLON.MeshBuilder.CreateSphere('star', { diameter: 0.3, segments: 4 }, scene);
            starMesh.material = starBaseMat;
            starMesh.isVisible = false; // The base mesh is invisible, only thin instances show

            var starMatrix = BABYLON.Matrix.Identity();
            for (var i = 0; i < starCount; i++) {
                var theta = Math.random() * Math.PI * 2;
                var phi = Math.acos(2 * Math.random() - 1);
                var r = 80 + Math.random() * 120; // Distance from center
                var m = BABYLON.Matrix.Translation(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.cos(phi),
                    r * Math.sin(phi) * Math.sin(theta)
                );
                starMesh.thinInstanceAdd(m);
            }

            // --- Planets ---
            var planetMeshes = [];
            var planetData = [
                { name: 'Core', color: '#8B5CF6', size: 1.6, pos: [22, 12, -35], layer: 'Core Self', activity: 0.8, health: 0.9, plt_influence: {p:0.1, l:0.0, t:0.0} },
                { name: 'Memory', color: '#FF6B9D', size: 1.3, pos: [-18, 8, -42], layer: 'Memory', activity: 0.7, health: 0.8, plt_influence: {p:0.0, l:0.1, t:0.0} },
                { name: 'Emotion', color: '#FFB347', size: 1.1, pos: [30, 6, -20], layer: 'Emotion', activity: 0.6, health: 0.7, plt_influence: {p:0.1, l:0.1, t:0.0} },
                { name: 'Will', color: '#4ECDC4', size: 1.4, pos: [-25, 14, -30], layer: 'Will', activity: 0.9, health: 0.95, plt_influence: {p:0.0, l:0.0, t:0.1} },
                { name: 'Creativity', color: '#EC4899', size: 1.0, pos: [35, 10, -48], layer: 'Creativity', activity: 0.75, health: 0.8, plt_influence: {p:0.1, l:0.1, t:0.1} },
                { name: 'Symbolic', color: '#8B5CF6', size: 1.8, pos: [-30, 5, -50], layer: 'Symbolic Self', activity: 0.85, health: 0.9, plt_influence: {p:0.0, l:0.1, t:0.1} },
                { name: 'Oracle', color: '#FFD166', size: 2.0, pos: [0, 18, -55], layer: 'The Oracle', activity: 0.99, health: 0.99, plt_influence: {p:0.2, l:0.2, t:0.2} }
            ];

            planetData.forEach(function(p) {
                var mat = new BABYLON.StandardMaterial('pMat_' + p.name, scene);
                mat.diffuseColor = BABYLON.Color3.FromHexString(p.color);
                mat.emissiveColor = BABYLON.Color3.FromHexString(p.color).scale(0.2);
                mat.specularColor = BABYLON.Color3.Black();
                var s = BABYLON.MeshBuilder.CreateSphere('planet_' + p.name, { diameter: p.size }, scene);
                s.position = new BABYLON.Vector3(p.pos[0], p.pos[1], p.pos[2]);
                s.material = mat;
                s.isPickable = true;
                s.actionManager = new BABYLON.ActionManager(scene);
                s.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, function() { showBuildingInfo(p, s); })); // Reusing building info panel for planets
                s.userData = { planetData: p, isDragging: false, dragStart: null, dragOffset: null };
                planetMeshes.push(s);
            });

            // --- Planet Dragging ---
            var draggedPlanet = null;
            var dragPlane = new BABYLON.Plane(0, 1, 0, 0); // Horizontal plane for dragging
            var dragOffset = new BABYLON.Vector3();

            scene.onPointerObservable.add(function(pointerInfo) {
                switch (pointerInfo.type) {
                    case BABYLON.PointerEventTypes.POINTERDOWN:
                        if (pointerInfo.pickInfo.hit && pointerInfo.pickInfo.pickedMesh && pointerInfo.pickInfo.pickedMesh.name.startsWith('planet_')) {
                            draggedPlanet = pointerInfo.pickInfo.pickedMesh;
                            var ray = scene.createPickingRay(scene.pointerX, scene.pointerY, BABYLON.Matrix.Identity(), camera);
                            var intersectPoint = ray.intersectsPlane(dragPlane);
                            if (intersectPoint) {
                                dragOffset = intersectPoint.subtract(draggedPlanet.position);
                                draggedPlanet.userData.isDragging = true;
                            }
                            logTerminal(`Dragging ${draggedPlanet.name}`);
                        }
                        break;
                    case BABYLON.PointerEventTypes.POINTERUP:
                        if (draggedPlanet) {
                            draggedPlanet.userData.isDragging = false;
                            logTerminal(`Released ${draggedPlanet.name}`);
                            draggedPlanet = null;
                        }
                        break;
                    case BABYLON.PointerEventTypes.POINTERMOVE:
                        if (draggedPlanet && draggedPlanet.userData.isDragging) {
                            var ray = scene.createPickingRay(scene.pointerX, scene.pointerY, BABYLON.Matrix.Identity(), camera);
                            var intersectPoint = ray.intersectsPlane(dragPlane);
                            if (intersectPoint) {
                                var newPos = intersectPoint.subtract(dragOffset);
                                // Limit planet movement within a sphere
                                if (newPos.length() > 70) {
                                    newPos.normalize();
                                    newPos.scaleInPlace(70);
                    }
                    shadowGenerator.addShadowCaster(mesh);
                    mesh.receiveShadows = true; // Buildings can receive shadows from each other
                                draggedPlanet.position.copyFrom(newPos);
                            }
                        }
                        break;
                }
            });


            // --- Ring planet ---
            var ringMat = new BABYLON.StandardMaterial('ringMat', scene);
            ringMat.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.9);
            ringMat.emissiveColor = new BABYLON.Color3(0.3, 0.1, 0.5);
            ringMat.alpha = 0.5;
            var ringPlanet = BABYLON.MeshBuilder.CreateSphere('ringP', { diameter: 1.2 }, scene);
            ringPlanet.position = new BABYLON.Vector3(-15, 16, -45);
            ringPlanet.material = ringMat;
            var ringMesh = BABYLON.MeshBuilder.CreateTorus('ring', { diameter: 2.4, thickness: 0.08, tessellation: 32 }, scene);
            ringMesh.position = ringPlanet.position.clone();
            ringMesh.rotation.x = Math.PI / 2.5;
            ringMesh.rotation.z = 0.3;
            var ringMat2 = new BABYLON.StandardMaterial('ringMat2', scene);
            ringMat2.diffuseColor = new BABYLON.Color3(0.9, 0.6, 0.8);
            ringMat2.emissiveColor = new BABYLON.Color3(0.2, 0.05, 0.3);
            ringMat2.alpha = 0.5;
            ringMesh.material = ringMat2;

            // --- Moon (PLT-reactive) ---
            var moonMat = new BABYLON.StandardMaterial('moonMat', scene);
            moonMat.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.9);
            moonMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.4);
            var moon = BABYLON.MeshBuilder.CreateSphere('moon', { diameter: 4.5 }, scene);
            moon.position = new BABYLON.Vector3(12, 24, -60);
            moon.material = moonMat;

            // --- Nebula ---
            var nebMat = new BABYLON.StandardMaterial('nebMat', scene);
            nebMat.diffuseColor = new BABYLON.Color3(0.2, 0.1, 0.3);
            nebMat.emissiveColor = new BABYLON.Color3(0.4, 0.1, 0.6);
            nebMat.alpha = 0.15;
            var nebula = BABYLON.MeshBuilder.CreateSphere('neb', { diameter: 35 }, scene);
            nebula.position = new BABYLON.Vector3(5, 20, -80);
            nebula.material = nebMat;

            // --- Ground + Grid ---
            var gndMat = new BABYLON.StandardMaterial('gndMat', scene);
            gndMat.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.04);
            gndMat.specularColor = BABYLON.Color3.Black();
            var ground = BABYLON.MeshBuilder.CreateGround('gnd', { width: 70, height: 70 }, scene);
            ground.material = gndMat;
            ground.receiveShadows = true;
            var gridMat = new BABYLON.StandardMaterial('gridMat', scene);
            gridMat.emissiveColor = new BABYLON.Color3(0.04, 0.15, 0.2);
            gridMat.diffuseColor = BABYLON.Color3.Black();
            gridMat.alpha = 0.25;
            var grid = BABYLON.MeshBuilder.CreateGround('grid', { width: 70, height: 70, subdivisions: 24 }, scene);
            grid.material = gridMat;
            grid.position.y = 0.08;

            // --- Water ---
            var waterMat = new BABYLON.StandardMaterial('waterMat', scene);
            waterMat.diffuseColor = new BABYLON.Color3(0.05, 0.1, 0.15);
            waterMat.emissiveColor = new BABYLON.Color3(0.02, 0.06, 0.1);
            waterMat.alpha = 0.6;
            var water = BABYLON.MeshBuilder.CreateGround('water', { width: 12, height: 4 }, scene);
            water.position = new BABYLON.Vector3(0, 0.02, 0);
            water.material = waterMat;

            // --- Trees (Instanced) ---
            var treeTrunkMesh = BABYLON.MeshBuilder.CreateCylinder('treeTrunk', { diameter: 0.15, height: 0.6 }, scene);
            var treeCanopyMesh = BABYLON.MeshBuilder.CreateSphere('treeCanopy', { diameter: 0.7, segments: 8 }, scene);
            treeTrunkMesh.isVisible = false; treeCanopyMesh.isVisible = false;

            var treeCount = 80;
            var treeTrunkMats = new BABYLON.Matrix();
            var treeCanopyMats = new BABYLON.Matrix();

            for (var i = 0; i < treeCount; i++) {
                var angle = Math.random() * Math.PI * 2;
                var dist = 10 + Math.random() * 25;
                var tx = Math.cos(angle) * dist, tz = Math.sin(angle) * dist;
                if (Math.abs(tx) < 15 && Math.abs(tz) < 15) continue;

                var mTrunk = BABYLON.Matrix.Translation(tx, 0.3, tz);
                treeTrunkMesh.thinInstanceAdd(mTrunk);

                var canopyScale = 0.7 + Math.random() * 0.4;
                var mCanopy = BABYLON.Matrix.Translation(tx, 0.8 + Math.random() * 0.2, tz).scale(canopyScale);
                treeCanopyMesh.thinInstanceAdd(mCanopy);
            }
            var trunkMat = new BABYLON.StandardMaterial('trunkMat', scene);
            trunkMat.diffuseColor = new BABYLON.Color3(0.15, 0.08, 0.05);
            treeTrunkMesh.material = trunkMat;
            shadowGenerator.addShadowCaster(treeTrunkMesh);

            var canopyMat = new BABYLON.StandardMaterial('canopyMat', scene);
            canopyMat.diffuseColor = new BABYLON.Color3(0.1, 0.35, 0.08);
            canopyMat.emissiveColor = new BABYLON.Color3(0.02, 0.08, 0.02);
            treeCanopyMesh.material = canopyMat;
            shadowGenerator.addShadowCaster(treeCanopyMesh);

            // --- Label helper ---
            function makeLabel(text, position, attachToMesh = null) {
                var plane = BABYLON.MeshBuilder.CreatePlane('lbl', { size: 2.2 }, scene);
                plane.position = position.clone();
                plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                plane.isPickable = false;
                if (attachToMesh) plane.parent = attachToMesh; // Attach to mesh if provided

                var c = document.createElement('canvas');
                c.width = 512; c.height = 128;
                var ctx = c.getContext('2d');
                ctx.font = 'bold 32px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 16;
                ctx.fillStyle = '#ccddff';
                ctx.fillText(text, 256, 60);
                var tex = new BABYLON.DynamicTexture('dynamicLabelTex', c, scene, true); // Dynamic texture
                tex.update(); // Initial update

                var mat = new BABYLON.StandardMaterial('lM', scene);
                mat.emissiveTexture = tex;
                mat.diffuseColor = BABYLON.Color3.Black();
                mat.specularColor = BABYLON.Color3.Black();
                mat.alpha = 0.9;
                plane.material = mat;
                return plane;
            }

            // --- Structures ---
            var structures = [];
            var structureData = []; // Store custom data for info panel

            function makeStructure(type, name, x, z, size, color, heightFactor = 1.0, emissiveIntensity = 0.2) {
                var group = new BABYLON.TransformNode(name + '_group', scene);
                group.position = new BABYLON.Vector3(x, 0, z);
                var mesh;
                var labelPos = new BABYLON.Vector3(x, 0, z);

                if (type === 'pyramid') {
                    mesh = BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop: 0, diameterBottom: size, height: size * heightFactor, tessellation: 4 }, scene);
                    mesh.position.y = (size * heightFactor) / 2;
                    labelPos.y = size * heightFactor + 0.8;
                    makeLabel(name, labelPos, group);
                } else if (type === 'ziggurat') {
                    var yPos = 0;

            makeStructure('pyramid', 'Great Pyramid', 0, -2, 4.5, new BABYLON.Color3(0.5, 0.3, 0.7));

            // --- Road paths ---
            var roadPaths = [];

            makeRoad([{ x: -20, z: -12 }, { x: -12, z: -18 }, { x: 0, z: -20 }, { x: 12, z: -18 }, { x: 20, z: -12 }, { x: 22, z: 0 }, { x: 20, z: 12 }, { x: 12, z: 18 }, { x: 0, z: 20 }, { x: -12, z: 18 }, { x: -20, z: 12 }, { x: -22, z: 0 }]);

            // --- Traffic System ---
            function TrafficCar(pathIdx, progress, color) {
                Entity.call(this); // Inherit from Entity
                this.path = roadPaths[pathIdx];
                if (!this.path || this.path.length < 2) return;

                this.progress = progress;
                this.speed = 3 + Math.random() * 4; // Max speed
                this.currentSpeed = this.speed;
                this.minSpeed = 0.5;
                this.color = color;
                this.length = 1.2;
                this.ahead = null; // Car in front
                this.distanceAhead = Infinity;

                this.mesh = new BABYLON.TransformNode('carGroup_' + Math.random().toString(36).substring(7), scene);
                this.mesh.position.y = 0.1;

                var body = BABYLON.MeshBuilder.CreateBox('carBody', { width: 0.6, height: 0.24, depth: this.length }, scene);
                body.position.y = 0.12;
                body.parent = this.mesh;
                var bodyMat = new BABYLON.StandardMaterial('carBodyMat', scene);
                bodyMat.diffuseColor = this.color;
                bodyMat.emissiveColor = this.color.scale(0.1);
                body.material = bodyMat;
                shadowGenerator.addShadowCaster(body);

                var cabin = BABYLON.MeshBuilder.CreateBox('carCabin', { width: 0.48, height: 0.16, depth: 0.6 }, scene);
                cabin.position = new BABYLON.Vector3(0, 0.32, -0.12);
                cabin.parent = this.mesh;
                var cabinMat = new BABYLON.StandardMaterial('carCabinMat', scene);
                cabinMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.5);
                cabinMat.alpha = 0.4;
                cabin.material = cabinMat;
                shadowGenerator.addShadowCaster(cabin);

                this.update = function(dt, allCars) {
                    // Collision detection for cars
                    this.ahead = null;
                    this.distanceAhead = Infinity;
                    var currentCarPos = this.mesh.position;

                    for (var i = 0; i < allCars.length; i++) {
                        var otherCar = allCars[i];
                        if (otherCar === this) continue;

                        var otherCarPos = otherCar.mesh.position;
                        var dist = BABYLON.Vector3.Distance(currentCarPos, otherCarPos);

                        var carDir = this.mesh.getDirection(BABYLON.Axis.Z);
                        var toOther = otherCarPos.subtract(currentCarPos).normalize();

                        if (BABYLON.Vector3.Dot(carDir, toOther) > 0.8 && dist < 10 && dist < this.distanceAhead) {
                            this.ahead = otherCar;
                            this.distanceAhead = dist;
                        }
                    }

                    // Adjust speed based on car ahead
                    var targetSpeed = this.speed;
                    if (this.ahead && this.distanceAhead < 8) {
                        var brakeFactor = Math.max(0, (this.distanceAhead - 1.5) / 6.5); // Start braking at 8 units
                        targetSpeed = this.minSpeed + (this.speed - this.minSpeed) * brakeFactor;
                        if (this.distanceAhead < 2) targetSpeed = 0; // Stop if too close
                    }
                    this.currentSpeed += (targetSpeed - this.currentSpeed) * dt * 2; // Smooth speed change
                    this.currentSpeed = Math.max(0, this.currentSpeed); // No reverse

                    // Update position
                    this.progress += (this.currentSpeed / 200) * dt;
                    if (this.progress > 1) this.progress -= 1;
                    if (this.progress < 0) this.progress += 1;

                    var idx = this.progress * (this.path.length - 1);
                    var i0 = Math.max(0, Math.floor(idx));
                    var i1 = Math.min(i0 + 1, this.path.length - 1);
                    var f = idx - i0;

                    var p1 = this.path[i0], p2 = this.path[i1];
                    var currentPos = p1.add(p2.subtract(p1).scale(f));
                    this.mesh.position.copyFrom(currentPos);

                    // Update rotation
                    var lookAheadIdx = Math.min(i0 + 3, this.path.length - 1); // Look a bit ahead for smoother turning
                    var pLookAhead = this.path[lookAheadIdx];
                    var direction = pLookAhead.subtract(currentPos);
                    if (direction.length() > 0.01) {
                        this.mesh.rotation.y = Math.atan2(direction.x, direction.z);
                    }
                };
                entities.push(this); // Add to global entities list
            }

            var cars = [];
            var carColors = [
                new BABYLON.Color3(0.9, 0.2, 0.2), new BABYLON.Color3(0.2, 0.6, 0.9),
                new BABYLON.Color3(0.9, 0.7, 0.1), new BABYLON.Color3(0.1, 0.8, 0.4),
                new BABYLON.Color3(0.6, 0.2, 0.8), new BABYLON.Color3(0.2, 0.2, 0.2),
                new BABYLON.Color3(0.8, 0.4, 0.1), new BABYLON.Color3(0.1, 0.5, 0.7),

            // --- Matrix Clusters (frame-synced) ---
            var matrixClusters = [];
            function MatrixCluster() {
                Entity.call(this); // Inherit from Entity
                var pos = new BABYLON.Vector3((Math.random() - 0.5) * 80, 15 + Math.random() * 25, -40 - Math.random() * 30);
                this.mat = new BABYLON.StandardMaterial('mxM', scene);
                this.mat.emissiveColor = new BABYLON.Color3(0.9, 0.2, 0.7);
                this.mat.alpha = 0.6;
                this.mesh = BABYLON.MeshBuilder.CreatePlane('mxP', { size: 4 + Math.random() * 3 }, scene);
                this.mesh.position = pos;
                this.mesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                this.mesh.material = this.mat;

                this.canvas = document.createElement('canvas');
                this.canvas.width = 128; this.canvas.height = 256;
                this.ctx = this.canvas.getContext('2d');
                this.data = [];
                for (var r = 0; r < 20; r++) {
                    var row = [];
                    for (var c = 0; c < 14; c++) {
                        row.push(String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96)));
                    }
                    this.data.push(row);
                }
                this.time = 0;
                this.dynamicTexture = new BABYLON.DynamicTexture('matrixTex', this.canvas, scene, true);
                this.mat.emissiveTexture = this.dynamicTexture;

                this.update = function(dt) {
                    this.time += dt / 1000 * 0.5; // Slower update
                    this.ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    this.ctx.fillRect(0, 0, 128, 256);
                    this.ctx.font = '10px monospace';
                    for (var r = 0; r < 20; r++) {
                        for (var c = 0; c < 14; c++) {
                            var ch = this.data[r][c];
                            var bright = 0.3 + Math.sin(this.time + r * 0.3 + c * 0.2) * 0.3;
                            this.ctx.fillStyle = 'rgba(180,60,160,' + (bright * 0.6) + ')';
                            this.ctx.fillText(ch, c * 9 + 2, r * 12 + 10);
                        }
                    }
                    this.dynamicTexture.update();
                };
                entities.push(this);
            }
            for (var mi = 0; mi < 6; mi++) matrixClusters.push(new MatrixCluster());

            // --- Shooting Stars (Pooled) ---
            var shootingStars = [];

            var MAX_SHOOTING_STARS = 5;

            function ShootingStar() {
                Entity.call(this);
                this.mesh = BABYLON.MeshBuilder.CreateLines('trail', { points: [BABYLON.Vector3.Zero(), BABYLON.Vector3.Zero()] }, scene);
                this.mesh.color = new BABYLON.Color3(1, 1, 1);
                this.mesh.isVisible = false;
                this.reset();
                entities.push(this);
            }
            ShootingStar.prototype.reset = function(sx, sy, sz, dx, dy, dz, vel) {
                this.pos = new BABYLON.Vector3(sx || 0, sy || 0, sz || 0);
                this.vel = new BABYLON.Vector3(dx || 0, dy || 0, dz || 0).scale(vel || 0);
                this.life = 0;
                this.maxLife = 0.5 + Math.random() * 0.5;
                this.mesh.isVisible = false;
                this.mesh.points = []; // Clear old points
            };
            ShootingStar.prototype.spawn = function() {
                var sx = (Math.random() - 0.5) * 120;
                var sy = 30 + Math.random() * 40;
                var sz = -50 - Math.random() * 40;
                var dx = (Math.random() - 0.5) * 0.8;
                var dy = -0.3 - Math.random() * 0.4;
                var dz = -0.2 - Math.random() * 0.3;
                var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                dx /= len; dy /= len; dz /= len;
                var vel = 35 + Math.random() * 25;

                this.reset(sx, sy, sz, dx, dy, dz, vel);
                this.mesh.isVisible = true;

                // Regenerate trail points
                var pts = [];
                for (var i = 0; i < 15; i++) {
                    pts.push(this.pos.add(new BABYLON.Vector3(dx * i * -0.3, dy * i * -0.3, dz * i * -0.3)));
                }
                this.mesh = BABYLON.MeshBuilder.CreateLines(this.mesh.name, { points: pts, instance: this.mesh }, scene); // Update existing lines mesh
            };
            ShootingStar.prototype.update = function(dt) {
                if (!this.mesh.isVisible) return;

                this.life += dt;
                var progress = this.life / this.maxLife;

                if (progress > 1) {
                    this.mesh.isVisible = false;
                    shootingStarPool.push(this); // Return to pool
                    return;
                }

                this.pos.addInPlace(this.vel.scale(dt));
                this.mesh.position.copyFrom(this.pos);

            };

            for (var si = 0; si < MAX_SHOOTING_STARS; si++) {
                shootingStarPool.push(new ShootingStar());

                else if (action === 'planets') planetData.forEach(function(p) { logTerminal(p.name + ' (' + p.layer + ')'); });

            engine.runRenderLoop(function() {
                var dt = engine.getDeltaTime() / 1000; // Convert to seconds

                // Update PLT based on activity and car movement (Core Loop)
                var activeCars = cars.filter(c => c.currentSpeed > 0).length;
                var totalActivity = structureData.reduce((sum, s) => sum + s.activityLevel, 0);

                PLT.profit = Math.max(0.1, Math.min(0.9, PLT.profit + (activeCars * 0.0001 * dt) + (totalActivity * 0.00005 * dt)));
                PLT.love = Math.max(0.1, Math.min(0.9, PLT.love + (planetMeshes.length * 0.0001 * dt) + (cars.filter(c => c.ahead === null).length * 0.00005 * dt))); // Love from freely moving cars, many planets
                PLT.tax = Math.max(0.1, Math.min(0.9, PLT.tax + (cars.filter(c => c.ahead !== null && c.distanceAhead < 5).length * 0.0001 * dt) + (structureData.length * 0.00002 * dt))); // Tax from traffic jams, many structures

                // Update moon color based on PLT
                var moonColor = PLT.getMoonColor();
                moonMat.diffuseColor = moonColor;
                moonMat.emissiveColor = moonColor.scale(0.4);
                document.getElementById('moon-plt-display').textContent = `${PLT.profit.toFixed(2)}/${PLT.love.toFixed(2)}/${PLT.tax.toFixed(2)}`;

                ACCUMULATOR += dt;
                while (ACCUMULATOR >= PHYSICS_DT) {
                    // Update all entities
                    entities.forEach(function(entity) {
                        if (entity.update) entity.update(PHYSICS_DT, cars);
                    });

                    // General animations
                    moon.rotation.y += PHYSICS_DT * 0.02;
                    moon.rotation.x += PHYSICS_DT * 0.005;
                    ringPlanet.rotation.y += PHYSICS_DT * 0.015;
                    ringMesh.rotation.z += PHYSICS_DT * 0.008;

                    ACCUMULATOR -= PHYSICS_DT;
                }

                scene.render();
            });

            window.addEventListener('resize', function() { engine.resize(); });

            logTerminal('Dark City core initialized. Press ` for help.');
        })();
    } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        var t = document.getElementById('terminal');
        t.classList.add('active');
        document.getElementById('terminal-log').innerHTML += '<div style="color:#ff6b6b">[FATAL] ' + e.message + '</div>';
    }
    </script>
</body>
</html>
