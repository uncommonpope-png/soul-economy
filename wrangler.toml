name = "soul-economy"
main = "api/src/index.js"
compatibility_date = "2026-09-01"

# One origin: static site (free & unlimited) + /api/* (Square API) on the same worker.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "soul-economy"
database_id = "928b98a6-0f88-43ff-8476-2dfb29a5460e"
