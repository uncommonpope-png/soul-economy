name = "soul-economy"
main = "api/src/index.js"
compatibility_date = "2026-09-01"

# Backend relay sync: public relays new signed kind-1 posts are
# re-broadcast to in the background (see api/src/relay-sync.mjs).
# Public list, no secrets. Overridable from the Cloudflare dashboard
# without a code change; empty/invalid values fall back to the default.
[vars]
NOSTR_RELAYS = "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net,wss://relay.snort.social"

# One origin: static site (free & unlimited) + /api/* (Square API) on the same worker.
[ai]
binding = "AI"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws", "/healthz", "/media/*"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "soul-economy-media"

[[kv_namespaces]]
binding = "KV"
id = "859601a647334e7d91f4cd59f32b61fa"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "FamilyRoom"

[[durable_objects.bindings]]
name = "FEEDROOM"
class_name = "FeedRoom"

# Soul Telephone always-open line (v1, 1:1). One 'lines' instance holds
# every line; sockets are tagged by pair key (see api/src/telephone-line.mjs).
[[durable_objects.bindings]]
name = "LINEROOM"
class_name = "TelephoneLine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FeedRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["TelephoneLine"]

[[d1_databases]]
binding = "DB"
database_name = "soul-economy"
database_id = "928b98a6-0f88-43ff-8476-2dfb29a5460e"
